<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雙分化">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>雙分化訓練</title>
<style>
  :root {
    --bg: #05070d; --panel: #0d1424; --line: #1d2b4a; --blue: #3d8bff; --blue-dim: #16325f;
    --text: #e8eefc; --muted: #8796b8; --green: #2ecc71; --red: #ff5d5d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 120px); }
  header { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 14px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  .back { background: none; border: 0; color: var(--blue); font-size: 17px; padding: 8px 4px; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 14px; }
  .grid { display: grid; gap: 10px; }
  .grid.two { grid-template-columns: 1fr 1fr; }
  button.card {
    background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 14px;
    padding: 16px; font-size: 17px; text-align: left; width: 100%; font-family: inherit;
  }
  button.card:active { background: var(--blue-dim); }
  button.card .sub { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  button.card.done { border-color: var(--green); }
  button.card.day { font-size: 22px; font-weight: 700; text-align: center; padding: 22px 8px; }
  .day small { display: block; color: var(--blue); font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .section { margin: 18px 0 10px; font-size: 15px; color: var(--blue); }
  .section span { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .badge { color: var(--green); font-size: 13px; margin-left: 6px; }

  .weight { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 10px 0 14px; }
  .weight button { width: 64px; height: 64px; border-radius: 12px; border: 0; background: var(--blue-dim);
    color: var(--text); font-size: 20px; font-weight: 600; }
  .weight button:active { background: var(--blue); }
  .weight input { width: 100%; text-align: center; background: none; border: 0; color: var(--text);
    font-size: 40px; font-weight: 700; font-family: inherit; }
  .weight .unit { color: var(--muted); font-size: 13px; text-align: center; }
  .last { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--blue);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--text); }
  .reps { display: flex; gap: 8px; margin-bottom: 12px; }
  .reps button { flex: 1; padding: 14px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font-size: 17px; font-family: inherit; }
  .reps button.on { background: var(--blue-dim); border-color: var(--blue); font-weight: 700; }
  .progress { text-align: center; color: var(--green); font-size: 14px; margin: 12px 0 0; }
  .big { width: 100%; border: 0; border-radius: 16px; padding: 20px; font-size: 20px; font-weight: 700;
    background: var(--blue); color: #fff; font-family: inherit; }
  .big:active { filter: brightness(.85); }
  .ghost { width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    background: none; color: var(--muted); font-size: 15px; font-family: inherit; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
  .sets li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .sets li b { color: var(--blue); margin-right: 4px; }

  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .summary h3 { margin: 0 0 8px; font-size: 16px; }
  .summary h4 { margin: 10px 0 4px; font-size: 14px; color: var(--blue); }
  .summary p { margin: 2px 0; font-size: 14px; line-height: 1.5; }
  .summary p span { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .row > * { flex: 1; }

  #timer { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
    background: #0f1d38; border: 1px solid var(--blue); border-radius: 16px; padding: 12px 16px;
    display: none; align-items: center; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #timer.show { display: flex; }
  #timer.over { border-color: var(--green); background: #0f2a1d; }
  #timer .t { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #timer .l { flex: 1; font-size: 13px; color: var(--muted); }
  #timer button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  #toast { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 50%; transform: translateX(-50%);
    background: var(--green); color: #002b12; font-weight: 600; padding: 8px 16px; border-radius: 20px;
    opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 14px; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="timer"><div class="t" id="timer-t">0:00</div><div class="l" id="timer-l"></div>
  <button id="timer-add">+30s</button><button id="timer-x">✕</button></div>
<div id="toast"></div>
<input type="file" id="import-file" accept="application/json" hidden>

<script>
const TARGET_SETS = [3, 4];       // 每個動作 3-4 組
const REP_CHOICES = [10, 11, 12];  // 每組 10-12 下
const TARGET_TEXT = `${TARGET_SETS.join("-")} 組 × ${REP_CHOICES[0]}-${REP_CHOICES.at(-1)} 下`;
const WEIGHT_STEP = 2.5;

// 雙分化：[部位, 建議, 休息秒數, 動作]
const PLAN = {
  "胸背": [
    ["胸背", "", 180, ["臥推", "引體向上", "推肩", "划船", "俯臥撐"]],
  ],
  "四肢": [
    ["下肢", "", 180, ["深蹲", "硬拉"]],
    ["肩・手臂", "", 120, ["側平舉", "彎舉", "錘式彎舉"]],
  ],
};
// 每個訓練日對應星期幾（0 = 週日）
const WEEKDAYS = { "胸背": [1, 4], "四肢": [2, 5] };
const WEEKDAY_NAMES = "日一二三四五六";
const DAYS = Object.keys(PLAN);

// ---------- 儲存 ----------
const store = {
  get logs() { return JSON.parse(localStorage.getItem("logs") || "[]"); },
  set logs(v) { localStorage.setItem("logs", JSON.stringify(v)); },
  get weights() { return JSON.parse(localStorage.getItem("weights") || "{}"); },
  set weights(v) { localStorage.setItem("weights", JSON.stringify(v)); },
  get reps() { return JSON.parse(localStorage.getItem("reps") || "{}"); },
  set reps(v) { localStorage.setItem("reps", JSON.stringify(v)); },
};

const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const fmtW = w => w ? `${+w.toFixed(2)}kg` : "自重";
const setsToday = ex => store.logs.filter(l => l.date === today() && l.ex === ex);
const getWeight = ex => {
  const w = store.weights;
  if (ex in w) return w[ex];
  const last = store.logs.filter(l => l.ex === ex).pop();
  return last ? last.w : 0;
};
const getReps = ex => store.reps[ex] ?? REP_CHOICES[0];
const setReps = (ex, n) => { const r = store.reps; r[ex] = n; store.reps = r; };
// 上一次（今天以前）做這個動作的所有組
const lastSession = ex => {
  const past = store.logs.filter(l => l.ex === ex && l.date < today());
  if (!past.length) return null;
  const date = past.at(-1).date;
  return { date, sets: past.filter(l => l.date === date) };
};
const fmtDate = d => d.slice(5).replace("-", "/");
const fmtSet = l => `${fmtW(l.w)}×${l.reps}`;
const lastText = ex => {
  const last = lastSession(ex);
  return last ? `上次 ${fmtSet(last.sets.at(-1))}` : "未做過";
};
const setWeight = (ex, v) => { const w = store.weights; w[ex] = Math.max(0, Math.round(v * 100) / 100); store.weights = w; };

// ---------- 畫面 ----------
const app = document.getElementById("app");
let stack = [{ view: "home" }];
const go = s => { stack.push(s); render(); scrollTo(0, 0); };
const back = () => { stack.pop(); render(); scrollTo(0, 0); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function header(title) {
  return `<header>${stack.length > 1 ? `<button class="back" data-act="back">‹ 返回</button>` : ""}<h1>${esc(title)}</h1></header>`;
}

function summaryHTML(date, logs) {
  const parts = {};
  logs.forEach(l => ((parts[l.part] ??= {})[l.ex] ??= []).push(l));
  let html = `<div class="summary"><h3>📅 ${date}（${logs[0].day}日）</h3>`;
  for (const [part, exs] of Object.entries(parts)) {
    html += `<h4>${esc(part)}</h4>`;
    for (const [ex, sets] of Object.entries(exs))
      html += `<p>${esc(ex)}：${sets.length} 組 <span>｜${sets.map(fmtSet).join("、")}</span></p>`;
  }
  return html + "</div>";
}

const views = {
  home() {
    const n = store.logs.filter(l => l.date === today()).length;
    const wd = new Date().getDay();
    return header("雙分化訓練計劃") +
      `<p class="hint">每個動作 ${TARGET_TEXT}<br>組間休息：胸背腿 3min　肩手 2min</p>
       <div class="grid">${DAYS.map((d, i) => {
         const isToday = WEEKDAYS[d].includes(wd);
         return `<button class="card day ${isToday ? "done" : ""}" data-act="day" data-di="${i}">
           <small>${WEEKDAYS[d].map(x => "週" + WEEKDAY_NAMES[x]).join("　")}${isToday ? "・今天" : ""}</small>${d}</button>`;
       }).join("")}</div>
       <div class="row">
         <button class="ghost" data-act="today">📊 今日記錄${n ? `（${n} 組）` : ""}</button>
         <button class="ghost" data-act="history">🗓 歷史</button>
       </div>`;
  },
  day({ di }) {
    const parts = PLAN[DAYS[di]];
    return header(`${DAYS[di]}日`) + parts.map(([part, advice, rest, exs], gi) =>
      `${parts.length > 1 ? `<h4 class="section">${esc(part)}<span>休息 ${rest / 60} 分鐘</span></h4>` : ""}
       ${advice ? `<p class="hint">${esc(advice)}</p>` : ""}
       <div class="grid two">${exs.map((ex, ei) => {
        const n = setsToday(ex).length;
        return `<button class="card ${n ? "done" : ""}" data-act="ex" data-di="${di}" data-gi="${gi}" data-ei="${ei}">${esc(ex)}
          <span class="sub">${n ? `✅ ${n}/${TARGET_SETS.join("-")} 組` : lastText(ex)}</span></button>`;
      }).join("")}</div>`).join("");
  },
  ex({ di, gi, ei }) {
    const [part, advice, rest, exs] = PLAN[DAYS[di]][gi];
    const ex = exs[ei];
    const sets = setsToday(ex);
    const w = getWeight(ex), reps = getReps(ex);
    const progress = sets.length >= TARGET_SETS.at(-1) ? "🎉 已完成，可以換下一個動作"
      : sets.length >= TARGET_SETS[0] ? `✅ 已達 ${TARGET_SETS[0]} 組，想做可以再加 1 組` : "";
    return header(ex) +
      `<p class="hint">${esc(part)}${advice ? `｜${esc(advice)}` : ""}<br>目標 ${TARGET_TEXT}，組間休息 ${rest / 60} 分鐘</p>
       ${(last => last ? `<div class="last">上次（${fmtDate(last.date)}）：${last.sets.map(fmtSet).join("、")}</div>` : "")(lastSession(ex))}
       <div class="weight">
         <button data-act="w" data-d="-1">−${WEIGHT_STEP}</button>
         <div style="flex:1;min-width:0">
           <input id="w-input" type="number" inputmode="decimal" step="0.5" min="0" value="${w || ""}" placeholder="自重">
           <div class="unit">kg（空白 = 自重）</div>
         </div>
         <button data-act="w" data-d="1">+${WEIGHT_STEP}</button>
       </div>
       <div class="reps">${REP_CHOICES.map(n =>
         `<button class="${n === reps ? "on" : ""}" data-act="reps" data-n="${n}">${n} 下</button>`).join("")}</div>
       <button class="big" data-act="record">✅ 完成第 ${sets.length + 1} 組（${fmtW(w)}×${reps}）</button>
       ${progress ? `<p class="progress">${progress}</p>` : ""}
       ${sets.length ? `<ul class="sets">${sets.map((s, i) => `<li><b>${i + 1}</b>${fmtSet(s)}</li>`).join("")}</ul>
         <button class="ghost" data-act="undo">↩️ 撤銷上一組</button>` : ""}`;
  },
  today() {
    const logs = store.logs.filter(l => l.date === today());
    return header("今日記錄") + (logs.length ? summaryHTML(today(), logs) : `<div class="empty">今日還沒有記錄</div>`);
  },
  history() {
    const byDate = {};
    store.logs.forEach(l => (byDate[l.date] ??= []).push(l));
    const dates = Object.keys(byDate).sort().reverse();
    return header("歷史") +
      (dates.length ? dates.map(d => summaryHTML(d, byDate[d])).join("") : `<div class="empty">還沒有記錄</div>`) +
      `<p class="hint" style="margin-top:20px">記錄只存在這部 iPhone。換機或清除 Safari 資料前，記得先匯出備份。</p>
       <div class="row" style="margin-top:0">
         <button class="ghost" data-act="export">⬆️ 匯出備份</button>
         <button class="ghost" data-act="import">⬇️ 匯入備份</button>
       </div>`;
  },
};

function render() {
  const s = stack[stack.length - 1];
  app.innerHTML = views[s.view](s);
  const input = document.getElementById("w-input");
  if (input) input.addEventListener("input", () => {
    const { di, gi, ei } = s;
    setWeight(PLAN[DAYS[di]][gi][3][ei], parseFloat(input.value) || 0);
    const btn = app.querySelector('[data-act="record"]');
    const ex = PLAN[DAYS[di]][gi][3][ei];
    btn.textContent = btn.textContent.replace(/（.*）/, `（${fmtW(getWeight(ex))}×${getReps(ex)}）`);
  });
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1500);
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  unlockAudio();
  const s = stack[stack.length - 1];
  const { di, gi, ei } = Object.fromEntries(Object.entries(b.dataset).map(([k, v]) => [k, +v]));
  switch (b.dataset.act) {
    case "back": return back();
    case "day": return go({ view: "day", di });
    case "ex": return go({ view: "ex", di, gi, ei });
    case "today": return go({ view: "today" });
    case "history": return go({ view: "history" });
    case "w": {
      const ex = PLAN[DAYS[s.di]][s.gi][3][s.ei];
      setWeight(ex, getWeight(ex) + WEIGHT_STEP * +b.dataset.d);
      return render();
    }
    case "reps": {
      setReps(PLAN[DAYS[s.di]][s.gi][3][s.ei], +b.dataset.n);
      return render();
    }
    case "record": {
      const [part, , rest, exs] = PLAN[DAYS[s.di]][s.gi];
      const ex = exs[s.ei], w = getWeight(ex), reps = getReps(ex);
      store.logs = [...store.logs, { date: today(), day: DAYS[s.di], part, ex, reps, w, ts: Date.now() }];
      startTimer(rest, ex);
      toast(`已記錄 ${fmtW(w)}×${reps}`);
      return render();
    }
    case "undo": {
      const ex = PLAN[DAYS[s.di]][s.gi][3][s.ei];
      const logs = store.logs;
      for (let i = logs.length - 1; i >= 0; i--)
        if (logs[i].date === today() && logs[i].ex === ex) { logs.splice(i, 1); break; }
      store.logs = logs;
      stopTimer();
      toast("已撤銷上一組");
      return render();
    }
    case "export": {
      const blob = new Blob([JSON.stringify({ logs: store.logs, weights: store.weights }, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `gym-${today()}.json`; a.click();
      return;
    }
    case "import": return document.getElementById("import-file").click();
  }
});

document.getElementById("import-file").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.logs)) throw 0;
    if (!confirm(`匯入 ${data.logs.length} 組記錄？目前的記錄會被取代。`)) return;
    store.logs = data.logs; store.weights = data.weights || {};
    toast("匯入完成"); render();
  } catch { alert("檔案格式不正確"); }
  e.target.value = "";
});

// ---------- 休息計時 ----------
const timerEl = document.getElementById("timer");
let tick = null, audioCtx = null, wakeLock = null;

function unlockAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  if (audioCtx?.state === "suspended") audioCtx.resume();
}
function beep() {
  if (!audioCtx) return;
  [0, 0.25, 0.5].forEach(t => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.3, audioCtx.currentTime + t);
    o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.15);
  });
}

function startTimer(sec, ex) {
  localStorage.setItem("timer", JSON.stringify({ end: Date.now() + sec * 1000, ex, beeped: false }));
  navigator.wakeLock?.request("screen").then(l => wakeLock = l).catch(() => {});
  runTimer();
}
function stopTimer() {
  localStorage.removeItem("timer");
  clearInterval(tick); tick = null;
  timerEl.classList.remove("show", "over");
  wakeLock?.release().catch(() => {}); wakeLock = null;
}
function runTimer() {
  clearInterval(tick);
  const update = () => {
    const t = JSON.parse(localStorage.getItem("timer") || "null");
    if (!t) return stopTimer();
    const left = Math.round((t.end - Date.now()) / 1000);
    timerEl.classList.add("show");
    if (left > 0) {
      timerEl.classList.remove("over");
      document.getElementById("timer-t").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
      document.getElementById("timer-l").textContent = `休息中｜${t.ex}`;
    } else {
      timerEl.classList.add("over");
      document.getElementById("timer-t").textContent = "GO";
      document.getElementById("timer-l").textContent = `休息結束！開始 ${t.ex} 下一組 💪`;
      if (!t.beeped) { beep(); t.beeped = true; localStorage.setItem("timer", JSON.stringify(t)); }
      if (left < -600) stopTimer();
    }
  };
  update();
  tick = setInterval(update, 500);
}
document.getElementById("timer-x").onclick = stopTimer;
document.getElementById("timer-add").onclick = () => {
  const t = JSON.parse(localStorage.getItem("timer") || "null");
  if (!t) return;
  t.end = Math.max(t.end, Date.now()) + 30000; t.beeped = false;
  localStorage.setItem("timer", JSON.stringify(t));
  runTimer();
};
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && localStorage.getItem("timer")) {
    runTimer();
    if (!wakeLock) navigator.wakeLock?.request("screen").then(l => wakeLock = l).catch(() => {});
  }
});

render();
if (localStorage.getItem("timer")) runTimer();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
